name: bamdaddesk-control
services:
  api:
    image: bamdaddesk-control:local
    build: .
    restart: unless-stopped
    environment:
      BAMDAD_DATA: /data
      BAMDAD_ORIGIN: ${BAMDAD_ORIGIN:?Set BAMDAD_ORIGIN}
    volumes:
      - ${BAMDAD_DATA_DIR:?Set BAMDAD_DATA_DIR}:/data
    read_only: true
    tmpfs:
      - /tmp:size=220m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - control
networks:
  control:
