services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "${BAMDAD_HTTPS_PORT:-443}:443"
    environment:
      BAMDAD_DOMAIN: ${BAMDAD_DOMAIN:?Set BAMDAD_DOMAIN}
      BAMDAD_TLS_EMAIL: ${BAMDAD_TLS_EMAIL:?Set BAMDAD_TLS_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - control
volumes:
  caddy_data:
  caddy_config:
